<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
       Favourite Movies
    </ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/home">
        <ion-icon slot="icon-only" name="home"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
<movie-card *ngFor="let fav of favouritesToDisplay" [movie]="fav"></movie-card>
</ion-content>
